"name": "Registration Form 1",
"tags": ["Registration Form"]
}
-->
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
  <div class="mb-8">
    <h3 class="text-2xl font-bold text-gray-800">Create account</h3>
    <p class="text-gray-500 text-sm">Start your 30-day free trial.</p>
  </div>
  <form class="space-y-4" onsubmit="event.preventDefault()">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        placeholder="John Doe">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        placeholder="john@example.com">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        placeholder="••••••••">
    </div>
    <button class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition-colors">Create
      account</button>
  </form>
</div>

<!--
{
"name": "Registration Form 2",
"tags": ["Registration Form"]
}
-->
<div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row">
  <div class="md:w-1/2 bg-indigo-600 p-12 text-white flex flex-col justify-center">
    <h3 class="text-3xl font-bold mb-4">Join our community of creators.</h3>
    <p class="text-indigo-100 mb-8">Get access to exclusive resources and networking opportunities worldwide.</p>
    <div class="flex -space-x-2">
      <div class="w-10 h-10 rounded-full bg-indigo-400 border-2 border-indigo-600"></div>
      <div class="w-10 h-10 rounded-full bg-indigo-300 border-2 border-indigo-600"></div>
      <div class="w-10 h-10 rounded-full bg-indigo-200 border-2 border-indigo-600"></div>
      <div
        class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-indigo-600 text-xs font-bold border-2 border-indigo-600">
        +10k</div>
    </div>
  </div>
  <div class="md:w-1/2 p-12">
    <form class="space-y-5" onsubmit="event.preventDefault()">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-semibold text-gray-500 uppercase">First Name</label>
          <input type="text" class="w-full border-b border-gray-300 py-2 focus:border-indigo-600 outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 uppercase">Last Name</label>
          <input type="text" class="w-full border-b border-gray-300 py-2 focus:border-indigo-600 outline-none">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase">Email Address</label>
        <input type="email" class="w-full border-b border-gray-300 py-2 focus:border-indigo-600 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase">Password</label>
        <input type="password" class="w-full border-b border-gray-300 py-2 focus:border-indigo-600 outline-none">
      </div>
      <button
        class="w-full bg-indigo-600 text-white py-3 rounded-xl shadow-lg hover:shadow-indigo-200 transition-all font-bold">Sign
        Up Now</button>
    </form>
  </div>
</div>
